name: Build Tmod arm64

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout Tmod
        uses: actions/checkout@v6
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Build bootstrap for com.huatiencode
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/termux/termux-packages.git "$RUNNER_TEMP/termux-packages"
          python3 scripts/patch-packages.py "$RUNNER_TEMP/termux-packages"
          cd "$RUNNER_TEMP/termux-packages"
          grep -q '^TERMUX_APP__PACKAGE_NAME="com.huatiencode"$' scripts/properties.sh
          bash -n packages/ncurses/build.sh
          ./scripts/run-docker.sh ./scripts/build-bootstraps.sh --architectures aarch64 --add apt,python,python-pip
          test -s bootstrap-aarch64.zip
      - name: Prepare Tmod package repository
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils
          bash scripts/prepare-apt-repo.sh "$RUNNER_TEMP/termux-packages" "$RUNNER_TEMP/termux-packages/bootstrap-aarch64.zip" "$RUNNER_TEMP/tmod-site"
          cp "$RUNNER_TEMP/termux-packages/bootstrap-aarch64.zip" app/src/main/cpp/bootstrap-aarch64.zip
      - name: Upload Tmod package repository
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/tmod-site
      - name: Build arm64 APK
        shell: bash
        env:
          TERMUX_PACKAGE_VARIANT: apt-android-7
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew assembleDebug
          test -s app/build/outputs/apk/debug/termux-app_apt-android-7-debug_arm64-v8a.apk
      - name: Verify package ID and bootstrap
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/termux-app_apt-android-7-debug_arm64-v8a.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -maxdepth 2 -type f -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "$APK" | grep -F "package: name='com.huatiencode'"
          unzip -l "$APK" | grep -F 'lib/arm64-v8a/libtermux-bootstrap.so'
          sha256sum "$APK" > tmod-arm64.sha256
      - name: Upload Tmod APK
        uses: actions/upload-artifact@v6
        with:
          name: Tmod-arm64
          path: |
            app/build/outputs/apk/debug/termux-app_apt-android-7-debug_arm64-v8a.apk
            tmod-arm64.sha256
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Tmod package repository
        id: deployment
        uses: actions/deploy-pages@v4
