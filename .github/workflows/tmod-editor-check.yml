name: Check Tmod editor

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'app/**'
      - '.github/workflows/tmod-editor-check.yml'

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare compile-only bootstrap marker
        run: |
          mkdir -p app/src/main/cpp
          printf 'compile-only' > app/src/main/cpp/bootstrap-aarch64.zip
      - name: Install Android SDK 37
        run: |
          set -euo pipefail
          sdkmanager="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}" -type f -name sdkmanager | head -n 1)"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" "platforms;android-37"
      - name: Compile app Java sources
        env:
          TERMUX_SPLIT_APKS_FOR_DEBUG_BUILDS: '1'
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac
