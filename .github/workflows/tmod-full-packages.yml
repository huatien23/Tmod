name: Build all Tmod arm64 packages

on:
  workflow_dispatch:
    inputs:
      selection:
        description: Build all recipes or retry recipes missing from the published repository
        type: choice
        options: [all, missing]
        default: all
      recipes:
        description: Explicit recipe names. Used instead of selection when not empty.
        required: false
        type: string
        default: ""

jobs:
  enumerate:
    runs-on: ubuntu-24.04
    outputs:
      batches: ${{ steps.recipes.outputs.batches }}
    steps:
      - uses: actions/checkout@v6
      - id: recipes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SELECTION: ${{ inputs.selection }}
          RECIPES: ${{ inputs.recipes }}
        run: |
          if [[ -n "$RECIPES" ]]; then
            printf '%s\n' $RECIPES > "$RUNNER_TEMP/explicit-recipes.txt"
            echo "batches=$(python3 scripts/recipe-batches.py --file "$RUNNER_TEMP/explicit-recipes.txt")" >> "$GITHUB_OUTPUT"
          elif [[ "$SELECTION" == missing ]]; then
            echo "batches=$(python3 scripts/recipe-batches.py --missing)" >> "$GITHUB_OUTPUT"
          else
            echo "batches=$(python3 scripts/recipe-batches.py)" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: enumerate
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        packages: ${{ fromJson(needs.enumerate.outputs.batches) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Prepare package recipes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          for attempt in 1 2 3 4 5; do
            if git clone --depth 1 "https://x-access-token:${GITHUB_TOKEN}@github.com/termux/termux-packages.git" "$RUNNER_TEMP/termux-packages"; then
              break
            fi
            rm -rf "$RUNNER_TEMP/termux-packages"
            sleep $((attempt * 10))
          done
          test -f "$RUNNER_TEMP/termux-packages/scripts/properties.sh"
          python3 scripts/patch-packages.py "$RUNNER_TEMP/termux-packages"
          python3 scripts/cache-release-assets.py "$RUNNER_TEMP/termux-packages"
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/termux-packages/output
          key: tmod-debs-${{ github.run_id }}-${{ strategy.job-index }}
          restore-keys: tmod-debs-
      - name: Record restored packages
        run: find "$RUNNER_TEMP/termux-packages/output" -maxdepth 1 -name '*.deb' -printf '%f\n' > "$RUNNER_TEMP/tmod-baseline.txt" || true
      - name: Build recipes
        shell: bash
        env:
          PACKAGE_RECIPES: ${{ matrix.packages }}
        run: |
          cd "$RUNNER_TEMP/termux-packages"
          if test -d output; then chmod -R a+rwX output; fi
          failures=0
          : > "$RUNNER_TEMP/failed-recipes.txt"
          for recipe in $PACKAGE_RECIPES; do
            if ! ./scripts/run-docker.sh ./build-package.sh -I --reuse-built-packages -a aarch64 "$recipe"; then
              echo "Failed recipe: $recipe"
              printf '%s\n' "$recipe" >> "$RUNNER_TEMP/failed-recipes.txt"
              failures=$((failures + 1))
            fi
          done
          echo "Batch finished with $failures failed recipes"
      - name: Upload failed recipe names
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failed-recipes-${{ strategy.job-index }}
          path: ${{ runner.temp }}/failed-recipes.txt
          if-no-files-found: ignore
      - name: Publish completed packages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TMOD_RELEASE_PREFIX: tmod-retry-${{ github.run_id }}-${{ strategy.job-index }}
          TMOD_BASELINE_FILE: ${{ runner.temp }}/tmod-baseline.txt
        run: python3 scripts/publish-package-batch.py "$RUNNER_TEMP/termux-packages/output"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/termux-packages/output
          key: tmod-debs-${{ github.run_id }}-${{ strategy.job-index }}
