name: Continue Tmod package builds

on:
  workflow_run:
    workflows: ["Build all Tmod arm64 packages"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed package-build run to inspect
        required: true

jobs:
  next:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v7
      - name: Rebuild recipes that failed
        env:
          CONTINUE_TOKEN: ${{ secrets.CONTINUE_TOKEN }}
          RUN_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.run_id || github.event.workflow_run.id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/continue-packages.py
